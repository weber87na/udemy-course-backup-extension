<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Udemy 課程下載能力檢查</title><link rel="stylesheet" href="batch.css"><link rel="stylesheet" href="library-scan.css"></head>
<body><main>
  <header><div class="eyebrow">UDEMY / DOWNLOAD CHECK · <span id="version"></span></div><h1>看看哪些課程可以留下來</h1>
  <p>結果會同步標示在「我的課程」卡片上。</p></header>
  <section class="card"><h2 id="scope">讀取檢查範圍…</h2>
    <p id="explanation"></p><p class="small">「可下載」指目前工具支援的來源：檢查清單與首個影片片段，不代表全片已下載或其他畫質皆可用。檢查會短暫播放並暫停，可能更新最近觀看位置；影片不會保存到電腦。</p>
    <div class="buttons"><button id="start" disabled>開始檢查</button><button id="stop" class="secondary" disabled>停止</button><button id="source" class="secondary" disabled>返回我的課程</button></div>
    <p id="status" role="status" aria-live="polite">準備檢查</p><progress id="progress" max="1" value="0" aria-label="課程檢查進度"></progress>
    <p id="error" role="alert" hidden></p>
    <p class="small">保持本頁開啟，並讓 Chrome 視窗保持可見。若背景播放器等待啟動，工具會短暫顯示自己建立的課程分頁；取得來源後返回原分頁，完成或停止後關閉檢查分頁。不要手動切換檢查分頁的課程。</p>
  </section>
  <section class="card"><h2>檢查結果</h2><div id="courses"></div></section>
</main><script type="module" src="library-scan.js"></script></body></html>
